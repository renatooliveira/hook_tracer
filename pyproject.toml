[project]
name = "hook-tracer"
version = "0.1.0"
description = "A developer-only Anki hook tracer"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "anki==26.9.3",
    "aqt==26.9.3",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
files = ["hook_tracer"]
strict = true
